(--line);border-radius:99px;text-decoration:none}.reaction-wrap{margin-top:26px;padding:18px;background:var(--paper2);border-radius:16px}.reaction-wrap h3{margin:0 0 5px;font-size:18px;letter-spacing:-.03em}.reaction-wrap p{font-size:12px;color:#65635b;margin:0 0 14px}.reaction-buttons{display:flex;gap:7px;flex-wrap:wrap}.reaction{background:var(--white);border:1px solid #c9c6bc;border-radius:99px;padding:10px 12px;font-size:11px;font-weight:850}.reaction.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}.toast{position:fixed;z-index:20;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;font-weight:800;border-radius:999px;padding:12px 16px;box-shadow:var(--shadow);transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.bottom-nav{position:fixed;z-index:15;bottom:0;left:0;right:0;padding:9px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(239,237,230,.94);backdrop-filter:blur(15px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}.nav-btn{border:0;background:transparent;color:#78776f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px 3px;font-size:9px;font-weight:800;letter-spacing:.02em}.nav-btn .nav-icon{font-size:20px;line-height:1}.nav-btn.active{color:var(--red)}.footnote{margin:30px 0 6px;color:var(--muted);font-size:10px;line-height:1.6;text-align:center}.about-mark{font-size:47px;line-height:.9;letter-spacing:-.08em;font-weight:950;margin:12px 0 18px}.about-panel{padding:22px;border-radius:18px;background:var(--ink);color:var(--paper)}.about-panel p{color:#c9c6bc;font-size:14px;line-height:1.65}.rule-list{display:grid;gap:0}.rule{display:flex;gap:13px;padding:15px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.55}.rule:last-child{border-bottom:0}.rule-no{color:var(--red);font:9 <script>
const albums = {
  paidinfull:{
    id:'paidinfull', issue:'001', label:'Фундамент', artist:'Eric B. & Rakim', title:'Paid in Full', year:'1987', labelName:'4th & B’way', runtime:'около 45 мин', genre:'золотая эра хип-хопа', country:'Нью-Йорк, США', spotify:'https://open.spotify.com/search/Eric%20B.%20%26%20Rakim%20Paid%20in%20Full', source:'https://www.allmusic.com/album/paid-in-full-mw0000193005', cover:'blackup', feature:'Когда рэп меняет внутренний ритм',
    description:'Дебютная пластинка, на которой Rakim превращает рифмовку в сложный ритмический инструмент, а сэмплы и скретчи Eric B. задают каркас каждой композиции.',
    intro:'Главный эксперимент Paid in Full — не скорость и не громкость, а свобода внутри такта. Rakim может смещать акценты, связывать рифмы внутри строки и оставлять паузы там, где слушатель ждёт привычного ударения. Eric B. строит вокруг этого лаконичные, узнаваемые звуковые конструкции.',
    context:'Paid in Full — дебютный альбом дуэта из Нью-Йорка, выпущенный в 1987 году на 4th & B’way. Он закрепил иной подход к рэп-подаче: вместо очевидной рифмы в конце каждой строки Rakim использует внутренние рифмы, более сложные синтаксические конструкции и спокойную, почти невозмутимую манеру. Важна и роль диджея: скретчи, повторяющиеся фрагменты и узнаваемые сэмплы не просто украшают рэп, а становятся частью композиции. В разных переизданиях могут отличаться длительность и оформление треков.',
    facts:[
      'Это дебютный студийный альбом Eric B. & Rakim; оригинальный релиз датируется 1987 годом.',
      'В AllMusic продюсерами указаны Eric B. и Rakim; среди кредитов также есть инженер Patrick Adams и мастеринг-инженер Herb Powers.',
      'Альбом содержит десять композиций в стандартной последовательности; разные издания могут давать немного отличающиеся длительности.',
      'Влияние пластинки связано не только с битами: техника Rakim стала важной точкой отсчёта для последующих поколений MC.',
      '«Paid in Full» получила международную известность и благодаря ремиксу Coldcut «Seven Minutes of Madness» — это отдельная версия, не оригинальный альбомный микс.'
    ],
    tracks:[
      ['I Ain’t No Joke','3:56','Открывающий трек сразу показывает спокойную уверенность Rakim. Не следи только за концами строк: прислушайся к внутренним созвучиям и к тому, как слова ложатся между ударами. Смысловой жест — заявить мастерство без истеричной подачи.'],
      ['Eric B. Is on the Cut','3:51','Короткая демонстрация диджейской роли Eric B. Здесь скретч и работа с винилом — самостоятельный голос, а не пауза между рэп-композициями. Отметь, как альбом подчёркивает дуэт MC и DJ.'],
      ['My Melody','6:49','Одна из ранних визитных карточек дуэта. Rakim звучит как автор, который управляет потоком слогов, а не просто подгоняет слова под готовый ритм. Попробуй мысленно отбивать такт и заметить, как часто фраза пересекает привычную границу такта.'],
      ['I Know You Got Soul','4:48','Фанк-ориентированная энергия и вокальный фрагмент создают мгновенно узнаваемый крючок. Следи за повторением и тем, как один небольшой элемент превращается в основу всего грува. Сэмпл здесь не фон: он формирует характер трека.'],
      ['Move the Crowd','3:48','Композиция строится вокруг идеи контроля над аудиторией. Сравни плотность рифм с первым треком: Rakim не обязан повышать голос, чтобы удерживать внимание; ритмическая точность сама создаёт напор.'],
      ['Paid in Full','3:50','Заглавный трек соединяет рассказ о деньгах и повседневной необходимости с почти гипнотическим ритмическим рисунком. Важно не сводить его только к гимну богатству: название и повествование связаны с желанием выбраться из финансовой зависимости. Для сравнения позже послушай ремикс Coldcut отдельно.'],
      ['As the Rhyme Goes On','4:02','Здесь особенно полезно следить за непрерывностью фразы. Рифмы и интонация будто перетекают друг в друга, не подчёркивая каждую строку одинаковым образом. Отметь, где Rakim делает паузу и где, наоборот, проталкивает слова вперёд.'],

const coverCacheKey='no-signal-original-covers-v1';
function loadOriginalCovers(){
 let cache={};try{cache=JSON.parse(localStorage.getItem(coverCacheKey)||'{}')}catch(e){}
 const apply=(id,url)=>{document.querySelectorAll('[data-cover-id]').forEach(el=>{if(el.dataset.coverId!==id)return;el.style.backgroundImage='linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.28)),url("'+url+'")';el.style.backgroundSize='cover';el.style.backgroundPosition='center';el.classList.add('has-original-cover');const overlay=el.querySelector('.cover-album');if(overlay)overlay.style.textShadow='0 2px 12px rgba(0,0,0,.9)'})};
 for(const [id,url] of Object.entries(cache)){if(typeof url==='string'&&url.startsWith('https://'))apply(id,url)}
 const ids=[...new Set([...document.querySelectorAll('[data-cover-id]')].map(el=>el.dataset.coverId))];
 ids.forEach(async id=>{if(cache[id])return;const a=albums[id];if(!a)return;try{const response=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(a.artist+' '+a.title)+'&entity=album&limit=15');if(!response.ok)return;const data=await response.json();const norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9а-я]/g,'');const artist=norm(a.artist),title=norm(a.title);const hit=(data.results||[]).map(x=>({...x,score:(norm(x.artistName)===artist?3:0)+(norm(x.collectionName)===title?5:0)})).sort((x,y)=>y.score-x.score)[0];if(!hit||hit.score<8||!hit.artworkUrl100)return;const url=hit.artworkUrl100.replace(/100x100bb/,'600x600bb');cache[id]=url;try{localStorage.setItem(coverCacheKey,JSON.stringify(cache))}catch(e){}apply(id,url)}catch(e){}});
}
function setNav(){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));document.getElementById('header-issue').textContent=state.page==='article'?'READING ROOM':`Issue 001 / ${state.page==='archive'?'Archive':state.page==='saved'?'My collection':state.page==='about'?'Manifesto':'Deep Cuts'}`}
function go(page,albumId=null){state.page=page;state.album=albumId;state.openTrack=null;window.scrollTo({top:0,behavior:'smooth'});render()}
function card(id){const a=albums[id],s=getStore();return `<article class="album-card">${cover(a,true)}<div class="album-card-title">${esc(a.title)}</div><p class="album-card-artist">${esc(a.artist)}</p><div class="album-card-meta">${a.year} · ${esc(a.genre)}</div><button class="card-open" data-open="${id}">Открыть выпуск ↗</button><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin:9px 2px 2px"><span style="font-size:10px;color:var(--muted)">${s.reactions[id]?({'hooked':'● Зацепило','miss':'× Мимо','later':'◷ Позже'}[s.reactions[id]]):'Не отмечено'}</span><button data-save="${id}" title="Сохранить" aria-label="Сохранить" style="border:0;background:none;font-size:19px;padding:0;color:${s.saved.includes(id)?'var(--red)':'var(--muted)'}">${s.saved.includes(id)?'♥':'♡'}</button></div></article>`}
function home(){const a=albums.paidinfull,s=getStore();return `<div class="intro"><div><div class="eyebrow">Ежедневное музыкальное открытие</div><div class="section-heading" style="margin-top:6px">Альбом дня<span style="color:var(--red)">.</span></div></div><div class="date-stamp">МАРШРУТ · 60 АЛЬБОМОВ<br>ЭТАП 01 / ФУНДАМЕНТ</div></div><section class="hero">${cover(a)}<div class="hero-copy"><div class="hero-meta">${a.year} &nbsp;·&nbsp; ${esc(a.labelName)} &nbsp;·&nbsp; ${a.runtime}</div><h1>${esc(a.title)}</h1><div class="hero-artist">${esc(a.artist)}</div><p class="hero-description">${esc(a.description)}</p><div class="pills"><span class="pill">${esc(a.genre)}</span><span class="pill">10 треков</span><span class="pill">Выпуск 001</span></div><div class="button-row"><button class="btn primary" data-open="paidinfull">Читать выпуск <span class="tiny-icon">↗</span></button><a class="btn dark-outline" href="${a.spotify}" target="_blank" rel="noopener">Слушать ↗</a></div><div style="display:flex;gap:14px;margin-top:14px"><button class="btn dark-outline" data-save="paidinfull">${s.saved.includes('paidinfull')?'♥ В сохранённом':'♡ Сохранить'}</button><button class="btn dark-outline" data-reaction="paidinfull" data-value="later">◷ На потом</button></div></div></section>
<div class="feature-grid"><div class="feature-card"><div class="feature-number">01 / ЭТАП</div><h3>Фундамент</h3><p>Учимся слышать внутренние рифмы, фанк-сэмплы, работу диджея и ранний хардкор.</p></div><div class="feature-card"><div class="feature-number">02 / МЕТОД</div><h3>Слушай внимательно</h3><p>В каждом выпуске — исторический контекст, заметки по трекам и задание на прослушивание.</p></div><div class="feature-card"><div class="feature-number">03 / МАРШРУТ</div><h3>60 альбомов</h3><p>Пять этапов идут в заданном порядке. Выпуски будут подробно готовиться последовательно.</p></div></div>
<div class="section-row"><div><div class="eyebrow">Твой путь</div><h2 class="section-heading">Маршрут из 60 альбомов</h2></div><button class="text-link" data-page="archive">Открыть архив →</button></div><div class="mini-grid">${card('route-02')}${card('route-03')}</div><p class="footnote">Маршрут сохранён в исходном порядке. Подробный редакционный разбор первым подготовлен для Paid in Full; остальные карточки пока отмечают место альбома в программе.</p>`}
function archive(){const q=state.query.trim().toLowerCase();let ids=ORDER.filter(id=>{const a=albums[id];const text=(a.artist+' '+a.title+' '+a.genre+' '+a.year).toLowerCase();const match=!q||text.includes(q);const f=state.filter;const genreMatch=f==='all'||(f==='hiphop'&&a.genre.toLowerCase().includes('хип-хоп'))||(f==='experimental'&&(a.genre.toLowerCase().includes('experimental')||a.genre.toLowerCase().includes('noise')||a.genre.toLowerCase().includes('экспериментальный')));return match&&genreMatch});return `<div class="page-head"><div><div class="eyebrow">Все номера</div><h1 class="section-heading">Архив</h1></div><span class="label-count">${ids.length}</span></div><div class="searchbox"><input id="archive-search" type="search" placeholder="Альбом, артист, жанр…" value="${esc(state.query)}" aria-label="Поиск по архиву"></div><div class="filters"><button class="filter ${state.filter==='all'?'active':''}" data-filter="all">Все жанры</button><button class="filter ${state.filter==='hiphop'?'active':''}" data-filter="hiphop">Хип-хоп</button><button class="filter ${state.filter==='experimental'?'active':''}" data-filter="experimental">Экспериментальный</button></div>${ids.length?`<div class="mini-grid">${ids.map(card).join('')}</div>`:`<div class="empty"><strong>Ничего не нашлось</strong>Попробуй другое название или сбрось фильтр.</div>`}<p class="footnote">В архиве 60 альбомов учебного маршрута и 3 прежних редакционных выпуска. Полноценные разборы будут появляться последовательно.</p>`}
function saved(){const s=getStore(),ids=ORDER.filter(id=>s.saved.includes(id)||s.reactions[id]==='later');if(!ids.length)return `<div class="page-head"><div><div class="eyebrow">Личная коллекция</div><h1 class="section-heading">Моё</h1></div><span class="label-count">0</span></div><div class="empty"><strong>Полка пока пуста</strong>Сохрани альбом или отметь его «На потом» — он появится здесь.<div style="margin-top:15px"><button class="btn" data-page="archive">Открыть архив</button></div></div><p class="footnote">Сохранения и реакции остаются в локальном хранилище браузера на этом устройстве.</p>`;return `<div class="page-head"><div><div class="eyebrow">Личная коллекция</div><h1 class="section-heading">Моё</h1></div><span class="label-count">${ids.length}</span></div><p style="font-size:13px;color:var(--muted);margin-top:-8px;margin-bottom:17px">Сохранённое и отложенное на потом.</p><div class="mini-grid">${ids.map(card).join('')}</div><p class="footnote">Сохранения и реакции хранятся на этом устройстве. Это демонстрационная версия.</p>`}
function about(){return `<div class="about-panel"><div class="eyebrow" style="color:#e85b4c">MANIFESTO / 001</div><div class="about-mark">NO<br>SIGNAL<span style="color:var(--red)">.</span></div><p>Независимый музыкальный журнал для открытий за пределами привычной ленты. Один альбом в день — с контекстом, проверенными фактами, трек-листом и редакционным мнением.</p></div><div class="article-section"><div class="eyebrow">Принципы редакции</div><h2>Не алгоритм. Редакция.</h2><div class="rule-list"><div class="rule"><span class="rule-no">01</span><span><b>Один выпуск — один альбом.</b> Лучше глубже рассмотреть одну пластинку, чем бросить десяток названий в одну ленту.</span></div><div class="rule"><span class="rule-no">02</span><span><b>Факты отдельно от интерпретаций.</b> Даты, лейблы и состав проверяем. Субъективное мнение обозначаем как мнение.</span></div><div class="rule"><span class="rule-no">03</span><span><b>Разные сцены и жанры.</b> Не замыкаться на одном жанре, даже если с него началась история.</span></div><div class="rule"><span class="rule-no">04</span><span><b>Твоя полка — твоя.</b> Реакции помогают вести архив и со временем точнее выбирать открытия.</span></div></div></div><div class="article-section"><div class="eyebrow">Что сейчас работает</div><h2>Прототип 0.1</h2><p>В этой версии доступны переходы между экранами, трек-лист с раскрывающимися заметками, поиск по архиву, фильтры, сохранение альбомов и реакции. Данные остаются в локальном хранилище браузера.</p><p>Чтобы превратить сайт в устанавливаемое веб-приложение, его нужно разместить на HTTPS-хостинге. После публикации Safari сможет добавить NO SIGNAL на экран «Домой».</p></div><p class="footnote">NO SIGNAL — независимый музыкальный журнал · Made for listening closer.</p>`}
function article(id){const a=albums[id],s=getStore();if(!a)return home();const reaction=s.reactions[id];return `<button class="article-back" data-page="today">← Назад к выпускам</button><div class="article-layout"><div class="article-main"><div class="article-kicker">NO SIGNAL / ${a.issue} · ${esc(a.label)}</div><h1 class="article-title">${esc(a.title)}</h1><div class="article-artist">${esc(a.artist)}</div><div class="article-meta">${a.year} · ${esc(a.labelName)} · ${a.runtime}<br>${esc(a.genre)} · ${esc(a.country)} · ${a.tracks.length} треков</div><div class="article-cover">${cover(a)}</div><p style="font-size:17px;line-height:1.55;font-weight:680;letter-spacing:-.02em">${esc(a.description)}</p><div class="button-row" style="margin:16px 0 5px"><a class="btn primary" href="${a.spotify}" target="_blank" rel="noopener">Открыть в Spotify ↗</a><button class="btn" data-save="${id}">${s.saved.includes(id)?'♥ Сохранено':'♡ Сохранить'}</button></div><section class="article-section"><div class="eyebrow">Редакторская заметка</div><h2>${esc(a.feature)}</h2><p>${esc(a.intro)}</p><p>${esc(a.context)}</p></section><section class="article-section"><div class="eyebrow">Полезно знать</div><h2>Факты и контекст</h2><div class="fact-list">${a.facts.map((f,i)=>`<div class="fact"><b>0${i+1}</b><span>${esc(f)}</span></div>`).join('')}</div></section><section class="article-section"><div class="eyebrow">Listening guide</div><h2>Трек за треком</h2><p style="margin-bottom:14px">Нажми на трек, чтобы раскрыть редакционную заметку. Это ориентиры для прослушивания, а не единственно верная интерпретация.</p><div class="track-list">${a.tracks.map((t,i)=>`<div class="track ${state.openTrack===i?'open':''}"><button class="track-summary" data-track="${i}"><span class="track-no">${String(i+1).padStart(2,'0')}</span><span><span class="track-name">${esc(t[0])}</span><span class="track-time">${t[1]}</span></span><span class="track-chevron">＋</span></button><div class="track-note">${esc(t[2])}</div></div>`).join('')}</div></section><section class="article-section"><div class="eyebrow">Источники</div><h2>Проверить самому</h2><div class="sources"><a class="source-link" href="${a.source}" target="_blank" rel="noopener">Официальная / справочная страница ↗</a><a class="source-link" href="${a.spotify}" target="_blank" rel="noopener">Альбом в Spotify ↗</a></div><p style="font-size:11px;color:var(--muted);margin-top:10px">Интерпретации в трек-листе — редакционные заметки. Метаданные альбома и список треков приведены по страницам лейблов и музыкальных каталогов.</p></section><div class="reaction-wrap"><h3>Твой вердикт?</h3><p>Одно нажатие. Это помогает вести личную полку и улучшать следующие подборки.</p><div class="reaction-buttons"><button class="reaction ${reaction==='hooked'?'active':''}" data-reaction="${id}" data-value="hooked">● Зацепило</button><button class="reaction ${reaction==='miss'?'active':''}" data-reaction="${id}" data-value="miss">× Мимо</button><button class="reaction ${reaction==='later'?'active':''}" data-reaction="${id}" data-value="later">◷ Позже</button></div></div></div><aside class="article-side"><div class="feature-card"><div class="feature-number">ПРОФИЛЬ ВЫПУСКА</div><h3>${esc(a.artist)}</h3><p>${a.year} · ${esc(a.genre)}<br>${a.tracks.length} треков<br>${esc(a.labelName)}</p><div style="margin-top:14px"><button class="btn" style="width:100%" data-save="${id}">${s.saved.includes(id)?'♥ В сохранённом':'♡ Добавить в моё'}</button></div></div><div class="feature-card" style="margin-top:12px"><div class="feature-number">СЛУШАТЬ</div><h3>Без перемешивания</h3><p>Первый проход — подряд, без скипов. Второй — возвращайся к трекам, которые зацепили.</p><a class="btn" style="width:100%;margin-top:12px" href="${a.spotify}" target="_blank" rel="noopener">В Spotify ↗</a></div></aside></div><p class="footnote">NO SIGNAL · Выпуск ${a.issue} · Твой слушательский архив хранится на устройстве.</p>`}
function render(){setNav();const main=document.getElementById('main');if(state.page==='today')main.innerHTML=home();else if(state.page==='archive')main.innerHTML=archive();else if(state.page==='saved')main.innerHTML=saved();else if(state.page==='about')main.innerHTML=about();else if(state.page==='article')main.innerHTML=article(state.album);attach();}
let toastTimer;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
function attach(){document.querySelectorAll('#main [data-page]').forEach(b=>b.onclick=()=>{if(b.dataset.page==='archive')state.query='';go(b.dataset.page)});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go('article',b.dataset.open));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const id=b.dataset.save,s=getStore();s.saved=s.saved.includes(id)?s.saved.filter(x=>x!==id):[...s.saved,id];putStore(s);render();toast(s.saved.includes(id)?'Добавлено в «Моё»':'Убрано из сохранённого')});document.querySelectorAll('[data-reaction]').forEach(b=>b.onclick=()=>{const s=getStore(),id=b.dataset.reaction,value=b.dataset.value;if(s.reactions[id]===value)delete s.reactions[id];else s.reactions[id]=value;if(value==='later'&&s.reactions[id]==='later'&&!s.saved.includes(id))s.saved.push(id);putStore(s);render();toast(({hooked:'Отмечено: зацепило',miss:'Отмечено: мимо',later:'Отложено на потом'})[s.reactions[id]]||'Отметка удалена')});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.track);state.openTrack=state.openTrack===n?null:n;const id=state.album;render();if(id)document.querySelector(`[data-track="${n}"]`)?.scrollIntoView({block:'nearest',behavior:'smooth'})});const search=document.getElementById('archive-search');if(search){search.addEventListener('input',e=>{const pos=e.target.selectionStart;state.query=e.target.value;const y=window.scrollY;render();const next=document.getElementById('archive-search');next.focus();next.setSelectionRange(pos,pos);window.scrollTo(0,y)})}}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
render();
loadOriginalCovers();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
</body>
</html>
