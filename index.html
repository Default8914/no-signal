/* Listening mode: track progress and personal notes */
.listening-progress{padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--paper2);margin:0 0 16px}
.listening-progress-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font:800 10px ui-monospace,monospace;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.listening-progress-top strong{color:var(--ink);font-size:12px;white-space:nowrap}
.listening-progress-track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.listening-progress-track span{display:block;height:100%;width:0;background:var(--red);border-radius:99px;transition:width .18s ease}
.listening-complete{margin-top:12px;width:100%}
.track-row{display:grid;grid-template-columns:55px minmax(0,1fr);align-items:stretch;gap:4px}
.track-progress-check{display:flex;align-items:flex-start;gap:8px;padding:17px 0 0;color:var(--muted);font:700 10px ui-monospace,monospace;cursor:pointer}
.track-progress-check input{width:16px;height:16px;margin:0;accent-color:var(--red);flex-shrink:0}
.track-summary{grid-template-columns:minmax(0,1fr) 24px;min-width:0}
.track.done .track-name{color:var(--muted)}
.track.done .track-progress-check{color:var(--red)}
.track-note .editor-track-note{font-size:13px;line-height:1.65;color:var(--muted);margin:0 0 15px}
.personal-note-label{display:block;font-size:10px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.personal-track-note{width:100%;min-height:72px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:11px 12px;font:inherit;font-size:13px;line-height:1.5}
.personal-track-note:focus{outline:2px solid var(--red);outline-offset:1px}
.personal-note-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.personal-note-actions .btn{min-height:36px;padding:8px 11px;font-size:11px}
.track-personal-status{font-size:10px;color:var(--muted)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.archive-tools{display:flex;align-items:center;gap:8px;margin-bottom:18px}.archive-tools .searchbox{flex:1;min-width:0;margin:0}
.filter-group{margin:14px 0}.filter-label,.archive-sort label{display:block;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.stage-filters{flex-wrap:nowrap;overflow-x:auto;padding:2px 1px 6px;scrollbar-width:none}.stage-filters::-webkit-scrollbar{display:none}
.archive-sort{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 15px}.archive-sort label{margin:0}
.archive-sort select{max-width:65%;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--white);padding:10px 12px;color:var(--ink)}
.card-state{display:inline-flex;margin:9px 2px 0;padding:5px 8px;border-radius:99px;background:var(--paper2);font-size:10px;font-weight:800}.muted-state{color:var(--muted);font-weight:650}
.data-actions{flex-wrap:wrap;margin-top:14px}.album-card[data-card-open]{cursor:pointer}.album-card[data-card-open]:hover{border-color:var(--ink);box-shadow:0 8px 20px rgba(25,25,23,.07)}
:where(button,a,input,select,[tabindex]):focus-visible{outline:3px solid var(--red);outline-offset:3px}
.filter,.card-open,.nav-btn,.article-back,.btn{min-height:42px}
.album-card-title,.album-card-artist{overflow-wrap:anywhere}

/* NO SIGNAL / nocturne redesign */
:root{color-scheme:dark;--paper:#0d0e10;--paper2:#17191d;--ink:#f1efe9;--muted:#a2a5ae;--red:#ff604f;--line:#30343b;--white:#1c1f24;--green:#8ac8a4;--shadow:0 18px 48px rgba(0,0,0,.28)}
body{background:var(--paper);color:var(--ink);background-image:radial-gradient(ellipse at 50% -20%,rgba(255,96,79,.09),transparent 52%)}
.masthead{background:rgba(13,14,16,.9);color:var(--ink);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
.masthead:after{border-color:rgba(255,255,255,.14);box-shadow:0 0 0 20px rgba(255,255,255,.018),0 0 0 43px rgba(255,255,255,.012)}
.issue-label{color:#8d929c}.page{padding-top:25px}
.hero{border:1px solid #32353b;box-shadow:0 24px 70px rgba(0,0,0,.25)}
.hero-copy{background:linear-gradient(150deg,#191b20,#101114)}
.hero-description{color:#bdc1c8}.hero-editor-note{color:#ddd6d1}
.pill{border-color:#41444b;color:#d9dce2;background:rgba(255,255,255,.025)}
.btn{border-color:var(--line);color:var(--ink);background:#17191d}
.btn.primary{background:var(--red);color:#170b09;border-color:var(--red)}
.btn.dark{background:#f1efe9;color:#111}.btn.dark-outline{border-color:#454951;color:#f1efe9}
.btn.active{background:#f1efe9;color:#111;border-color:#f1efe9}
.feature-card{background:linear-gradient(145deg,#191b20,#141619);border-color:#30343b}.feature-card p{color:#b6bac2}

const albums = {
  paidinfull:{
    id:'paidinfull', issue:'001', label:'Фундамент', artist:'Eric B. & Rakim', title:'Paid in Full', year:'1987', labelName:'4th & B’way', runtime:'около 45 мин', genre:'золотая эра хип-хопа', country:'Нью-Йорк, США', spotify:'https://open.spotify.com/search/Eric%20B.%20%26%20Rakim%20Paid%20in%20Full', source:'https://www.allmusic.com/album/paid-in-full-mw0000193005', cover:'blackup', feature:'Когда рэп меняет внутренний ритм',
    description:'Дебютная пластинка, на которой Rakim превращает рифмовку в сложный ритмический инструмент, а сэмплы и скретчи Eric B. задают каркас каждой композиции.',
    intro:'Главный эксперимент Paid in Full — не скорость и не громкость, а свобода внутри такта. Rakim может смещать акценты, связывать рифмы внутри строки и оставлять паузы там, где слушатель ждёт привычного ударения. Eric B. строит вокруг этого лаконичные, узнаваемые звуковые конструкции.',
    context:'Paid in Full — дебютный альбом дуэта из Нью-Йорка, выпущенный в 1987 году на 4th & B’way. Он закрепил иной подход к рэп-подаче: вместо очевидной рифмы в конце каждой строки Rakim использует внутренние рифмы, более сложные синтаксические конструкции и спокойную, почти невозмутимую манеру. Важна и роль диджея: скретчи, повторяющиеся фрагменты и узнаваемые сэмплы не просто украшают рэп, а становятся частью композиции. В разных переизданиях могут отличаться длительность и оформление треков.',
    facts:[
      'Это дебютный студийный альбом Eric B. & Rakim; оригинальный релиз датируется 1987 годом.',
      'В AllMusic продюсерами указаны Eric B. и Rakim; среди кредитов также есть инженер Patrick Adams и мастеринг-инженер Herb Powers.',
      'Альбом содержит десять композиций в стандартной последовательности; разные издания могут давать немного отличающиеся длительности.',
      'Влияние пластинки связано не только с битами: техника Rakim стала важной точкой отсчёта для последующих поколений MC.',
      '«Paid in Full» получила международную известность и благодаря ремиксу Coldcut «Seven Minutes of Madness» — это отдельная версия, не оригинальный альбомный микс.'
    ],
    tracks:[
      ['I Ain’t No Joke','3:56','Открывающий трек сразу показывает спокойную уверенность Rakim. Не следи только за концами строк: прислушайся к внутренним созвучиям и к тому, как слова ложатся между ударами. Смысловой жест — заявить мастерство без истеричной подачи.'],
      ['Eric B. Is on the Cut','3:51','Короткая демонстрация диджейской роли Eric B. Здесь скретч и работа с винилом — самостоятельный голос, а не пауза между рэп-композициями. Отметь, как альбом подчёркивает дуэт MC и DJ.'],
      ['My Melody','6:49','Одна из ранних визитных карточек дуэта. Rakim звучит как автор, который управляет потоком слогов, а не просто подгоняет слова под готовый ритм. Попробуй мысленно отбивать такт и заметить, как часто фраза пересекает привычную границу такта.'],
      ['I Know You Got Soul','4:48','Фанк-ориентированная энергия и вокальный фрагмент создают мгновенно узнаваемый крючок. Следи за повторением и тем, как один небольшой элемент превращается в основу всего грува. Сэмпл здесь не фон: он формирует характер трека.'],
      ['Move the Crowd','3:48','Композиция строится вокруг идеи контроля над аудиторией. Сравни плотность рифм с первым треком: Rakim не обязан повышать голос, чтобы удерживать внимание; ритмическая точность сама создаёт напор.'],
      ['Paid in Full','3:50','Заглавный трек соединяет рассказ о деньгах и повседневной необходимости с почти гипнотическим ритмическим рисунком. Важно не сводить его только к гимну богатству: название и повествование связаны с желанием выбраться из финансовой зависимости. Для сравнения позже послушай ремикс Coldcut отдельно.'],
      ['As the Rhyme Goes On','4:02','Здесь особенно полезно следить за непрерывностью фразы. Рифмы и интонация будто перетекают друг в друга, не подчёркивая каждую строку одинаковым образом. Отметь, где Rakim делает паузу и где, наоборот, проталкивает слова вперёд.'],
      ['Chinese Arithmetic','4:10','Инструментальная и ритмическая сторона выходит на первый план. Слушай, как повторяемый рисунок и диджейская фактура создают движение без привычной схемы куплет—припев. Это часть альбомной идеи: хип-хоп как мастерство работы с ритмом.'],
      ['Eric B. Is President','6:20','Один из ключевых ранних треков дуэта, появившийся до альбома как сингл. Он подчёркивает статус Eric B. как диджея и задаёт минималистичный, почти церемониальный грув. Сравни его с более поздними треками альбома: слышно, как формируется язык дуэта.'],
      ['Extended Beat','3:49','Финал оставляет пространство самому биту. Не жди новой истории: воспринимай это как напоминание, что инструментал, петля и микширование могут быть полноценной частью хип-хоп-записи.']

    description:'Десять коротких музыкальных странностей: ломанный грув, туманные синтезаторы и рэп, который существует внутри звуковой среды, а не поверх неё.',

    tracks:[
      ['Free Press and Curl','4:15','Стартовый манифест альбома: упругий ритм задаёт опору, а голос движется рядом с ним, не пытаясь сделать композицию слишком гладкой.'],
      ['An Echo from the Hosts That Profess Infinitum','3:14','Название звучит как послание из другого пространства — музыка поддерживает это ощущение эхом и разреженными звуковыми слоями. Следи, как меняется плотность аранжировки.'],
      ['Are You... Can You... Were You? (Felt)','4:47','Более длинная композиция, в которой стоит следить не за ожидаемым припевом, а за отношениями между повторяющимися мотивами и голосом.'],
      ['A Treatease Dedicated to the Avian Airess from North East Nubis (1000 Questions, 1 Answer)','2:45','Короткая, нарочито загадочная зарисовка. Здесь важен сам способ подачи слов — как часть абстрактной музыкальной ткани.'],
      ['Youlogy','3:58','Одна из центральных точек пластинки: прислушайся к тому, как ритмическая основа и зыбкие слои создают чувство движения без очевидного разрешения.'],
      ['Endeavors for Never (The Last Time We Spoke You Said You Were Not Here. I Saw You Though.)','2:51','Голоса THEESatisfaction добавляют другую окраску и меняют баланс внутри трека. Хороший момент заметить, как приглашённые вокалисты вписаны в общий мир альбома.'],
      ['Recollections of the Wraith','3:35','Композиция больше похожа на атмосферную сцену, чем на традиционную рэп-песню. Дай повторяющимся деталям накопить эффект.'],
      ["The King's New Clothes Were Made by His Own Hands",'2:06','Короткий фрагмент, работающий как переход внутри альбома. Он меняет темп повествования и не пытается разрастись в полноценный эпос.'],
      ['Yeah You','3:20','В этой точке пластинка кажется резче и конфликтнее. Обрати внимание, как манера подачи поддерживает напряжение вместо того, чтобы сглаживать его.'],

    ]

    tracks:[
      ['Spiritual Healing','3:29','Начало с тяжёлой фактурой: послушай, как барабаны и шум создают физическое ощущение пространства.'],
      ['Speak Volumes','4:42','Хорошая точка входа: голос не отделён от инструментала, а встроен в его давление и движение.'],

 description:"Дебют A Tribe Called Quest соединяет джазовые оттенки, соул и разговорную подачу, создавая музыку, которая кажется лёгкой, но устроена тонко.",

 tracks:[["Bonita Applebum","—","Повторяющийся вокальный мотив делает трек мягким и почти ленивым. Слушай, как Q-Tip использует паузы: пространство между фразами становится частью ритма."],["Can I Kick It?","—","Вопрос-ответ и узнаваемый бас превращают песню в коллективную игру. Попробуй понять, почему минимальный набор элементов даёт такой устойчивый кач."],["Description of a Fool","—","Здесь сильнее слышна социальная наблюдательность. Сопоставь тему с тёплым фоном: Tribe могут задавать серьёзные вопросы без тяжеловесной аранжировки."]]

const fullTracksBatchA = {"route-03":[["Countdown to Armageddon","1:40","Вступление собирает фрагменты голосов и шум в ощущение приближающегося кризиса. Это звуковая рамка, которая настраивает на политически заряженный альбом."],["Bring the Noise","3:46","Chuck D требует внимания, а плотный монтаж будто спорит с ним. Шум и обрывки превращаются в часть аргумента, а не в декорацию."],["Don't Believe the Hype","5:19","Композиция ставит под сомнение медийные версии событий и образов. Сопоставь прямой текст с перегруженным звуком, который напоминает поток информации."],["Cold Lampin' with Flavor","4:17","Flavor Flav получает пространство для театральной, почти комической подачи. Этот эпизод показывает, что группа использует персонажей как музыкальный инструмент."],["Terminator X to the Edge of Panic","4:31","Скрэтчи и команды превращают DJ Terminator X в участника звуковой драматургии. Обрати внимание на ощущение преследования, которое создаёт монтаж."],["Mind Terrorist","1:21","Короткая композиция работает как звуковой лозунг и переход. Здесь важнее интонация и энергия, чем развернутый сюжет."],["Louder Than a Bomb","3:37","Название становится метафорой голоса, который трудно заглушить. Ритмический напор поддерживает идею слов как политической силы."],["Caught, Can We Get a Witness?","4:53","Песня обращается к слушателю как к свидетелю происходящего. Повтор фразы создаёт ощущение допроса и требует занять позицию."],["Show 'Em Whatcha Got","1:56","Короткий всплеск напоминает выступление на сцене. Это момент для внимания к груву и командной энергетике, а не к длинному повествованию."],["She Watch Channel Zero?!","3:49","Трек критикует телевидение и его влияние на восприятие реальности. Резкие гитарные и шумовые элементы усиливают идею медиасистемы, захватывающей внимание."],["Night of the Living Baseheads","3:14","Песня об эпидемии крэка, её человеческих последствиях и политическом лицемерии. Ироничные детали делают сатиру более едкой."],["Black Steel in the Hour of Chaos","6:23","Развёрнутый рассказ от лица заключённого строится как короткий фильм. Следи за последовательностью сцен и повторяющимися музыкальными сигналами."],["Security of the First World","1:20","Инструментальная передышка сохраняет тревожное ощущение движения. Она показывает, сколько смысла The Bomb Squad вкладывают в текстуры даже без куплета."],["Rebel Without a Pause","5:02","Ритмический цикл работает как мотор, почти не дающий передышки. Chuck D использует короткие ударные фразы, синхронизируя голос с пульсом бита."],["Prophets of Rage","3:19","Группа говорит от лица тех, кто отказывается принимать навязанные правила. Это пример соединения политического заявления и коллективного рэп-исполнения."],["Party for Your Right to Fight","3:25","Финал превращает пародийный оттенок знакомого лозунга в серьёзный призыв к действию. Заголовок переиначивает поп-культуру ради политической идеи."]],"route-04":[["Intro","1:41","Игровое вступление задаёт форму альбома как викторины и странного радиошоу. Оно приглашает слушателя принимать постоянные переключения."],["The Magic Number","3:16","Простой счёт превращается в манифест индивидуальности и группы из трёх участников. Детская интонация намеренная: за ней скрывается точное чувство ритма."],["Change in Speak","2:32","Группа играет с голосом, фразировкой и тем, как слова становятся перкуссией. Слушай изменения подачи между участниками."],["Cool Breeze on the Rocks","0:47","Короткий звуковой коллаж продолжает логику музыкальных цитат. Это монтажный стык, который поддерживает ощущение альбомной игры."],["Can U Keep a Secret?","1:38","Композиция построена как разговор с полушутливым секретом. De La Soul создают мини-сцену между более крупными песнями."],["Jenifa Taught Me (Derwin's Revenge)","3:25","История первой влюблённости звучит не как героическая победа, а как неловкое воспоминание. Весёлый грув контрастирует с уязвимостью рассказчика."],["Ghetto Thang","3:35","Социальная песня о городской жизни без упрощения до газетного заголовка. Лёгкое звучание делает текст не менее серьёзным."],["Transmitting Live from Mars","1:06","Интерлюдия звучит как инопланетная передача и подчёркивает интерес группы к необычным голосам. Это переход в другое настроение."],["Eye Know","4:06","Романтическая песня собирает разные соуловые фрагменты в цельное чувство. Каждый источник добавляет новый оттенок, не разрушая мелодию."],["Take It Off","1:53","Короткий игривый трек держится на повторе и провокационной интонации. Его стоит воспринимать как комический эпизод шоу."],["A Little Bit of Soap","0:47","Музыкальная миниатюра переигрывает старую поп-мелодию. Знакомый источник становится частью нового контекста благодаря монтажу."],["Tread Water","3:54","Образы выживания превращаются в сюрреалистичный рассказ. Следи за сменой картинок и тем, как голос не даёт им распасться."],["Potholes in My Lawn","4:14","Ямы на газоне становятся метафорой людей, вредящих из зависти. Слушай одновременно буквальный юмор и социальный подтекст."],["Say No Go","4:20","Песня говорит о наркотической зависимости и давлении среды. Заразительный рефрен помогает услышать предупреждение, а не скрывает его."],["Do as De La Does","1:58","Короткая демонстрация фирменной манеры группы: словесная игра, непринуждённость и смены ритма. Это миниатюрный автопортрет коллектива."],["Plug Tunin' (Last Chance to Comprehend)","4:13","Ранняя визитная карточка соединяет голосовой обмен с фрагментами сэмплов. Здесь уже слышно, как De La Soul строят собственный звуковой язык."],["De La Orgee","1:11","Интерлюдия использует преувеличение и комизм. Она важна для ритма всего релиза, а не для отдельного тезиса."],["Buddy","4:56","Гостевое собрание Native Tongues превращает трек в вечеринку коллективных голосов. Сравни подачи участников: общая эстетика не стирает индивидуальности."],["Description","1:24","Q-Tip появляется в короткой композиции, где язык важнее сюжетной развязки. Следи за плотностью рифм и тем, как вокал становится частью монтажа."],["Me Myself and I","3:41","Самый известный сингл звучит как отказ подчиняться чужим ожиданиям. Слушай его как заявление о самостоятельности, а не только как весёлый хит."],["This Is a Recording 4 Living in a Fulltime Era (L.I.F.E.)","3:16","Трек оформлен как объявление о современном времени. Он возвращает альбом к социальной наблюдательности после комических эпизодов."],["I Can Do Anything (Delacratic)","0:40","Короткий скетч играет с идеей личной свободы и абсурдной уверенностью. Его роль — связать соседние композиции."],["D.A.I.S.Y. Age","3:58","Трек закрепляет образ Daisy Age — яркий, ироничный и коллективный. Слушай, как лёгкость соседствует с технически сложным продакшеном."],["Plug Tunin' (Original 12\" Version)","3:41","Возвращение к ранней версии создаёт музыкальный круг. Сравни аранжировку с альбомной версией и услышь, как одна идея меняется при другом монтаже."]],"route-05":[["To All the Girls","1:29","Короткое вступление задаёт юмористический и нарочито провокационный тон. Это часть сценического образа трио, а не ключ ко всему альбому."],["Shake Your Rump","3:19","Бас, барабаны и вокальные обрывки складываются в непрерывный коллаж. Следи за ритмическими источниками: их много, но грув остаётся ясным."],["Johnny Ryall","3:00","Трек создаёт персонажа на границе уличной легенды и комиксового преувеличения. Группа использует разговорные детали вместо линейного сюжета."],["Egg Man","2:57","Шутливый образ становится основой цепочки словесных игр. Повторяющаяся петля удерживает целостность при смене деталей."],["High Plains Drifter","4:13","Рассказчик движется по городу как герой вестерна, но приключения намеренно бытовые и абсурдные. Комизм рождается из контраста масштаба и повседневности."],["The Sounds of Science","3:11","Один из самых ярких примеров сэмплового коллажа. Слушай, как фрагменты разных музыкальных эпох собраны в одну композицию."],["3-Minute Rule","3:39","Три участника разворачивают собственные истории в более длинном формате. Отметь разницу тембров и то, как м s="btn" data-cloud-sync>Синхронизировать мою полку</button><button class="btn" data-cloud-signout hidden>Выйти</button></div><p class="footnote">Локальная полка хранится на этом устройстве. После входа можно синхронизировать сохранённые альбомы и реакции с облаком. Никогда не вставляй сюда service_role или секретный ключ.</p><div id="editor-access-help" hidden></div><div id="editor-tools" hidden><div class="eyebrow" style="margin-top:24px">Редакторская панель</div><h3>Назначить альбом дня</h3><form id="daily-publish-form" class="cloud-form"><label for="daily-date">Дата выпуска</label><input id="daily-date" type="date" required><label for="daily-album">Альбом</label><select id="daily-album" required>${routeIds.map(id=>{const a=albums[id];return `<option value="${esc(id)}">${esc(a.artist+' — '+a.title+' ('+a.year+')')}</option>`}).join('')}</select><label for="daily-headline">Заголовок (необязательно)</label><input id="daily-headline" maxlength="140" placeholder="Редакционный заголовок"><label for="daily-note">Заметка редактора (необязательно)</label><textarea id="daily-note" rows="3" placeholder="Короткая вводная к выпуску"></textarea><button class="btn primary" type="submit">Опубликовать выпуск</button></form><p id="editor-status" role="status"></p></div></div><div class="article-section"><div class="eyebrow">Резервная копия</div><h2>Твои данные — под контролем</h2><p>Сохранённые альбомы, реакции и история открытий остаются доступны локально. Можно экспортировать их в файл и перенести на другое устройство.</p><div class="button-row data-actions"><button class="btn primary" data-export-data>Экспортировать данные</button><button class="btn" data-import-trigger>Импортировать JSON</button><input id="import-data-file" type="file" accept="application/json,.json" hidden></div></div><div class="article-section"><div class="eyebrow">Техническая версия</div><h2>Прогрессивное веб-приложение</h2><p>NO SIGNAL использует статический фронтенд и опциональный Supabase для PostgreSQL function article(id){const a=albums[id],s=getStore();if(!a)return home();const reaction=s.reactions[id],trackProgress=Array.isArray(s.trackProgress[id])?s.trackProgress[id]:[],trackNotes=s.trackNotes[id]||{},doneCount=trackProgress.slice(0,a.tracks.length).filter(Boolean).length,isCompleted=s.completedAlbums.includes(id),progressPct=a.tracks.length?Math.round(doneCount/a.tracks.length*100):0;return `<button class="article-back" data-page="${state.returnPage==='article'?'today':state.returnPage}">← Назад к ${state.returnPage==='archive'?'архиву':state.returnPage==='saved'?'моей полке':'выпускам'}</button><div class="article-layout"><div class="article-main"><div class="article-kicker">NO SIGNAL / ${a.issue} · ${esc(a.label)}</div><h1 class="article-title">${esc(a.title)}</h1><div class="article-artist">${esc(a.artist)}</div><div class="article-meta">${a.year} · ${esc(a.labelName)} · ${a.runtime}<br>${esc(a.genre)} · ${esc(a.country)} · ${a.tracks.length} треков</div><div class="article-cover">${cover(a)}</div><p style="font-size:17px;line-height:1.55;font-weight:680;letter-spacing:-.02em">${esc(a.description)}</p><div class="button-row" style="margin:16px 0 5px"><a class="btn primary" href="${a.spotify}" target="_blank" rel="noopener">Открыть в Spotify ↗</a>${geniusButton(a)}<button class="btn" data-save="${id}">${s.saved.includes(id)?'♥ Сохранено':'♡ Сохранить'}</button></div><section class="article-section"><div class="eyebrow">Редакторская заметка</div><h2>${esc(a.feature)}</h2><p>${esc(a.intro)}</p><p>${esc(a.context)}</p></section><section class="article-section"><div class="eyebrow">Полезно знать</div><h2>Факты и контекст</h2><div class="fact-list">${a.facts.map((f,i)=>`<div class="fact"><b>0${i+1}</b><span>${esc(f)}</span></div>`).join('')}</div></section><section class="article-section"><div class="eyebrow">Режим прослушивания</div><h2>Трек за треком</h2><p style="margin-bottom:14px">Отмечай треки по мере прослушивания, записывай личные мысли и возвращайся к ним позже. Прогресс сохраняется на этом устройстве.</p><div class="listening-progress"><div class="listening-progress-top"><span>ПРОГРЕСС АЛЬБОМА</span><strong data-progress-count>${doneCount} / ${a.tracks.length}</strong></div><div class="listening-progress-track" role="progressbar" aria-label="Прогресс прослушивания" aria-valuemin="0" aria-valuemax="${a.tracks.length}" aria-valuenow="${doneCount}"><span data-progress-fill style="width:${progressPct}%"></span></div><button class="btn listening-complete ${isCompleted?"active":""}" data-album-complete="${id}">${isCompleted?"✓ Альбом прослушан · снять отметку":"Отметить альбом прослушанным"}</button></div><div class="track-list">${a.tracks.map((t,i)=>{const done=!!trackProgress[i],note=trackNotes[i]||"";return `<div class="track ${state.openTrack===i?"open":""} ${done?"done":""}"><div class="track-row"><label class="track-progress-check"><input type="checkbox" data-track-done="${i}" ${done?"checked":""} aria-label="Отметить трек ${esc(t[0])} прослушанным"><span>${String(i+1).padStart(2,"0")}</span></label><button class="track-summary" data-track="${i}" aria-expanded="${state.openTrack===i}"><span><span class="track-name">${esc(t[0])}</span><span class="track-time">${esc(t[1])}</span></span><span class="track-chevron">＋</span></button></div><div class="track-note"><p class="editor-track-note">${esc(t[2])}</p><label class="personal-note-label" for="track-note-${i}">Твоя заметка</label><textarea id="track-note-${i}" class="personal-track-note" data-track-note="${i}" maxlength="800" rows="2" placeholder="Что заметил? Какой момент зацепил?">${esc(note)}</textarea><div class="personal-note-actions"><button class="btn" type="button" data-save-track-note="${i}">Сохранить заметку</button><span data-track-note-status="${i}" class="track-personal-status">${note?"Сохранено на этом устройстве":"Только для тебя"}</span></div></div></div>`}).join("")}</div></section><section class="article-section"><div class="eyebrow">Источники</div><h2>Проверить самому</h2><div class="sources"><a class="source-link" href="${a.source}" target="_blank" rel="noopener">Официальная / справочная страница ↗</a><a class="source-link" href="${a.spotify}" target="_blank" rel="noopener">Альбом в Spotify ↗</a><a class="source-link" href="${geniusUrl(a)}" target="_blank" rel="noopener noreferrer">Тексты на Genius ↗</a></div><p style="font-size:11px;color:var(--muted);margin-top:10px">Интерпретации в трек-листе — редакционные заметки. Метаданные альбома и список треков приведены по страницам лейблов и музыкальных каталогов.</p></section><div class="reaction-wrap"><h3>Твой вердикт?</h3><p>Одно нажатие. Это помогает вести личную полку и улучшать следующие подборки.</p><div class="reaction-buttons"><button class="reaction ${reaction==='hooked'?'active':''}" data-reaction="${id}" data-value="hooked">● Зацепило</button><button class="reaction ${reaction==='miss'?'active':''}" data-reaction="${id}" data-value="miss">× Мимо</button><button class="reaction ${reaction==='later'?'active':''}" data-reaction="${id}" data-value="later">◷ Позже</button></div></div></div><aside class="article-side"><div class="feature-card"><div class="feature-number">ПРОФИЛЬ ВЫПУСКА</div><h3>${esc(a.artist)}</h3><p>${a.year} · ${esc(a.genre)}<br>${a.tracks.length} треков<br>${esc(a.labelName)}</p><div style="margin-top:14px"><button class="btn" style="width:100%" data-save="${id}">${s.saved.includes(id)?'♥ В сохранённом':'♡ Добавить в моё'}</button></div></div><div class="feature-card" style="margin-top:12px"><div class="feature-number">СЛУШАТЬ</div><h3>Без перемешивания</h3><p>Первый проход — подряд, без скипов. Второй — возвращайся к трекам, которые зацепили.</p><a class="btn" style="width:100%;margin-top:12px" href="${a.spotify}" target="_blank" rel="noopener">В Spotify ↗</a></div></aside></div><p class="footnote">NO SIGNAL · Выпуск ${a.issue} · Твой слушательский архив хранится на устройстве.</p>`}

"route-15":{feature:"Точность и тепло без лишних слов",genre:"джаз-рэп",labelName:"Jive Records",runtime:"около 49 минут",description:"A Tribe Called Quest доводят джаз-рэп до баланса: бас и барабаны звучат упруго, а Q-Tip и Phife Dawg меняются ролями без потери общего характера.",intro:"Этот альбом строже дебюта, но не холоднее. Разные тембры и ритмика голосов создают движение даже там, где бит почти не меняется; голос условного гида превращает пластинку в поездку по сцене Нью-Йорка.",context:"Midnight Marauders вышел в 1993 году. Музыка основана на джазовых и соуловых сэмплах, но звучит компактно и целенаправленно. Тексты балансируют между баттл-игрой, социальной наблюдательностью и юмором. Альбом ценят за цельность: здесь доступны и музыкальная тонкость, и остроумие.",facts:["Альбом вышел в ноябре 1993 года на Jive Records.","Вступления и переходы ведёт голос условного гида.","Award Tour и Electric Relaxation стали ключевыми синглами."],wiki:"Midnight_Marauders",tracks:[

"route-16":{feature:"Десять треков без лишнего движения",genre:"бум-бэп / восточное побережье",labelName:"Columbia Records",runtime:"около 40 минут",description:"Nas превращает район, юность и амбиции в короткий литературный цикл; продакшен оставляет вокруг голоса воздух, а каждая песня добавляет новую грань одного мира.",intro:"Не слушай Illmatic как коллекцию синглов. Проследи за движением рассказчика — от улиц к самоанализу и уверенности в мастерстве. Биты DJ Premier, Pete Rock, Large Professor и Q-Tip различаются, но сохраняют общее ощущение пространства.",context:"Дебют Nas вышел в апреле 1994 года и стал эталоном нью-йоркского рэпа девяностых. Несколько продюсерских школ встретились на одной пластинке, а тексты построены на наблюдениях, внутренних рифмах и кинематографических деталях. Сила Illmatic — в точности языка и последовательности образов.",facts:["Альбом вышел в 1994 году на Columbia Records.","В продакшене участвовали DJ Premier, Pete Rock, Large Professor и Q-Tip.","Короткий трек-лист и плотность текста стали частью репутации альбома."],wiki:"Illmatic",tracks:[

"route-17":{feature:"Рождение героя и его крах",genre:"хардкор-хип-хоп / восточное побережье",labelName:"Bad Boy Records",runtime:"около 68 минут",description:"Ready to Die выстроен как мрачная автобиография с движением от безысходности к славе и обратно; лёгкость ритма делает тяжёлые истории ещё резче.",intro:"Следи за драматургией, а не только за знаменитыми синглами. Сначала слышен подросток, который учится выживать; позже появляется шоумен, но чувство угрозы не исчезает. Biggie может быть комичным, пугающим и уязвимым в пределах одной песни.",context:"Дебют The Notorious B.I.G. вышел в 1994 году на Bad Boy. Жёсткие барабаны и узнаваемые сэмплы соседствуют с поп-припевами, а гибкий флоу Biggie связывает уличный рассказ, юмор и саморефлексию. Альбом укрепил позиции нью-йоркского рэпа в период доминирования западного побережья.",facts:["Дебют вышел в сентябре 1994 года.","Среди продюсеров — Puff Daddy, Easy Mo Bee и Chucky Thompson.","Оригинальная версия завершается Suicidal Thoughts; переиздания добавляли бонусы."],wiki:"Ready_to_Die",tracks:[

"route-18":{feature:"Баттл-рэп с философским нервом",genre:"андеграунд / бум-бэп",labelName:"Wild Pitch Records",runtime:"около 53 минут",description:"O.C. соединяет технически точную читку с размышлениями о возрасте, идентичности и качестве рэпа; биты Buckwild и Lord Finesse подчёркивают текст, не затмевая его.",intro:"Слушай, как O.C. меняет режим: от соревновательной точности к воспоминаниям и социальной критике. Его голос звучит менее демонстративно и более созерцательно, чем у многих коллег по сцене D.I.T.C.",context:"Word...Life вышел в 1994 году на Wild Pitch. Продюсеры Buckwild, Lord Finesse и другие представители нью-йоркской школы создали основу для текстов O.C.; Pharoahe Monch появляется в качестве гостя. Коммерческий успех был скромным, но Time's Up и Born 2 Live сделали дебют важным для слушателей, ценящих технику и содержательность.",facts:["Дебют O.C. вышел в 1994 году.","Среди продюсеров — Buckwild и Lord Finesse.","Time's Up стала одной из центральных композиций андеграунд-рэпа девяностых."],wiki:"Word...Life",tracks:[

"route-19":{feature:"Технический рэп как нервная система",genre:"андеграунд / восточное побережье",labelName:"Hollywood BASIC",runtime:"около 46 минут",description:"Pharoahe Monch и Prince Poetry наращивают плотность рифм, многослойные биты и тревожные образы, превращая альбом в высказывание о давлении общества.",intro:"Организованный хаос рассчитан на внимательное слушание. Улавливай внутренние рифмы Pharoahe Monch, меняющиеся ударения Prince Poetry и драматические переходы; повторное прослушивание раскрывает связи между деталями.",context:"Второй альбом Organized Konfusion вышел в 1994 году. Дуэт из Куинса сочетал сложную технику с мрачной тематикой и неожиданными продюсерскими решениями. Stray Bullet рассказывает о пуле как безличной силе, меняющей множество жизней — пример того, как формальный эксперимент служит содержанию.",facts:["Альбом вышел в 1994 году.","В музыке использованы джазовые источники и нестандартные ритмические решения.","Stray Bullet — сюжетный эксперимент, рассказанный с нескольких точек зрения."],wiki:"Stress:_The_Extinction_Agenda",tracks:[

"route-22":{feature:"Холодная поэзия и шахматная стратегия",genre:"хардкор-хип-хоп / восточное побережье",labelName:"Geffen Records",runtime:"около 55 минут",description:"GZA читает с ледяным спокойствием, а RZA строит густой звуковой мир из кинодиалогов, мрачных сэмплов и резких ударных — рамку для метафор и многоуровневых рифм.",intro:"Сила не в крике, а в точности. Улавливай шахматные и martial-arts метафоры GZA, следи за интонацией и тем, как гости подстраиваются под его темп.",context:"Liquid Swords вышел в 1995 году и стал одним из самых цельных сольных альбомов первого периода Wu-Tang. RZA выстроил тревожную атмосферу из фрагментов соула и реплик из боевиков. GZA отвечает контролем и сложной образностью: он редко повышает голос, но каждую строку насыщает слоями смысла.",facts:["Альбом вышел в 1995 году на Geffen Records.","RZA использовал кинематографические диалоги как часть звуковой среды.","B.I.B.L.E. обычно отмечается как заключительный трек оригинальной версии."],wiki:"Liquid_Swords",tracks:[

"route-23":{feature:"Мрачная симметрия улицы",genre:"хардкор-хип-хоп",labelName:"Loud Records",runtime:"около 59 минут",description:"На Hell on Earth Mobb Deep доводят свою формулу до предела: тяжёлые петли, сдержанные голоса и чувство неизбежного столкновения становятся почти физическими.",intro:"Если The Infamous звучал как хроника района, этот альбом кажется более замкнутым и беспощадным. Отслеживай, как повторяющиеся мелодии создают напряжение, а гости вписываются в тот же холодный контекст.",context:"Третий альбом Mobb Deep вышел в 1996 году и продолжил мрачный стиль дуэта. Havoc усилил минимализм и кинематографический холод, а Prodigy сохранил отстранённую подачу. Вместо смягчения звучание создаёт ощущение осады: тексты возвращаются к выживанию, лояльности и последствиям уличной репутации.",facts:["Альбом вышел в 1996 году на Loud Records.","Это продолжение звучания The Infamous.","На Extortion появляется Method Man, а Give It Up Fast связывает пластинку с Nas."],wiki:"Hell_on_Earth_(Mobb_Deep_album)",tracks:[

function applyEditorialCatalog(catalog){
  for(const [id,d] of Object.entries(catalog)){
    const a=albums[id]; if(!a) continue;
    Object.assign(a,d);
    a.issue=String(Number(id.slice(6))).padStart(3,'0');
    a.wikiUrl=d.wiki?'https://en.wikipedia.org/wiki/'+d.wiki:'';
    delete a.wiki;
    a.source='https://www.allmusic.com/search/albums/'+encodeURIComponent(a.artist+' '+a.title);
    a.trackSource='https://musicbrainz.org/search?query='+encodeURIComponent(a.artist+' '+a.title)+'&type=release&method=indexed';
    a.editionNote='Трек-лист ориентирован на стандартное альбомное издание; порядок и бонус-треки переизданий могут отличаться.';
    a.tracks=d.tracks.map(row=>{const i=row.indexOf('¦');return [row.slice(0,i),'',row.slice(i+1)]});
  }
}

"route-26":{label:"Региональные школы",issue:"026",labelName:"Ruthless Records / Priority Records",runtime:"около 60 минут",genre:"West Coast / gangsta rap",country:"Комптон, Калифорния",feature:"Комптон выходит на передний план",description:"N.W.A превращают локальную злость и полицейское насилие в предельно прямой альбомный язык; продакшен оставляет голосам и ритму почти физическое пространство.",intro:"Первый проход слушай как последовательность сцен: заявление, конфликт, истории улицы, комические вставки и танцевальный финал. Во втором круге сравни сухие ударные, бас и смену голосов Ice Cube, MC Ren и Eazy-E.",context:"Straight Outta Compton вышел в 1988 году и стал одной из определяющих пластинок западного побережья. Dr. Dre и DJ Yella соединяют минималистичные ритмические петли с фанковыми источниками, а несколько MC создают коллективный портрет Комптона. Провокационность альбома нельзя отделить от его изображения полицейского давления, но грубая риторика и гендерные клише также требуют критического слушания.",facts:["Дебютный альбом вышел в 1988 году на Ruthless Records и Priority Records.","Продакшен связан прежде всего с Dr. Dre и DJ Yella; вокальные роли делят участники N.W.A.","Состав и названия отдельных треков различаются между оригинальными и переизданными версиями; маршрут использует 13-трековый вариант."]},
"route-27":{label:"Региональные школы",issue:"027",labelName:"Priority Records",runtime:"около 60 минут",genre:"West Coast / hardcore rap",country:"Лос-Анджелес, Калифорния",feature:"Западный голос встречает звук The Bomb Squad",description:"Ice Cube соединяет сарказм, политический гнев и криминальные зарисовки с насыщенным, почти перегруженным продакшеном, который заметно отличается от более фанкового G-funk.",intro:"Слушай пластинку как столкновение двух звуковых подходов: прямой голос Ice Cube и плотный монтаж The Bomb Squad. Особенно сравни короткие вызовы, сюжетные песни и интерлюдии, которые создают ощущение движения по городу.",context:"Вышедший в 1990 году AmeriKKKa's Most Wanted стал первым сольным альбомом Ice Cube после ухода из N.W.A. Значительную часть музыки подготовила команда The Bomb Squad, известная работой с Public Enemy. На пластинке жёсткий социальный комментарий соседствует с провокационной маской рассказчика, поэтому её лучше слушать не как простой набор криминальных историй, а как спор о власти, медиа, расе и уличной репутации.",facts:["Альбом вышел в 1990 году на Priority Records.","The Bomb Squad, работавшие с Public Enemy, придали альбому плотный коллажный саунд.","Пластинка закрепила самостоятельную сольную позицию Ice Cube после N.W.A."]},
"route-28":{label:"Региональные школы",issue:"028",labelName:"Death Row Records / Interscope Records",runtime:"около 54 минут",genre:"G-funk / West Coast rap",country:"Лонг-Бич, Калифорния",feature:"G-funk становится альбомным миром",description:"Dr. Dre строит плавную, узнаваемую звуковую среду, а расслабленная подача Snoop Dogg делает синтезаторы, бас и вокальные паузы центральными героями альбома.",intro:"Не спеши оценивать только по главным синглам. Послушай, как вступления, скиты, гостевые голоса и повторяющиеся мелодические ходы превращают Doggystyle в цельный мир; следи за паузами Snoop и тем, как бит будто оставляет ему место.",context:"Дебют Snoop Doggy Dogg вышел в 1993 году на Death Row Records при ключевом участии Dr. Dre. Пластинка стала одним из самых заметных воплощений G-funk: медленный грув, глубокий бас, синтезаторные мелодии и разговорная вокальная манера. За кажущейся расслабленностью стоит точный контроль аранжировки; при этом агрессивные и унизительные образы текстов стоит рассматривать критически, а не принимать за нейтральный реализм.",facts:["Дебютный альбом Snoop вышел в 1993 году на Death Row Records.","Dr. Dre выступил ключевой творческой силой продакшена.","Скиты и короткие переходы — часть последовательности альбома, а не случайные паузы между синглами."]},
"route-29":{label:"Региональные школы",issue:"029",labelName:"LaFace Records",runtime:"около 66 минут",genre:"Southern hip-hop / funk rap",country:"Атланта, Джорджия",feature:"Атланта заявляет собственный язык",description:"Дебют Outkast соединяет южный фанковый грув, разговорную наблюдательность и чувство места — Атланта здесь не периферия чужой сцены, а самостоятельный музыкальный центр.",intro:"Слушай альбом как радиопередачу из определённой среды: интерлюдии и короткие реплики создают место действия, а длинные песни раскрывают характер дуэта. Сравни фанковую основу с более жёстким нью-йоркским бум-бэпом того же времени.",context:"Southernplayalisticadillacmuzik вышел в 1994 году и стал дебютным альбомом Outkast. Продакшен Organized Noize, связи с Dungeon Family и выраженная южная идентичность помогли расширить представление о том, как может звучать хип-хоп вне Нью-Йорка и Лос-Анджелеса. Альбом сочетает браваду, бытовые наблюдения и музыкальность, унаследованную от фанка и соула.",facts:["Дебют Outkast вышел в 1994 году на LaFace Records.","В создании характерного звучания ключевую роль сыграла продюсерская команда Organized Noize.","Интерлюдии и повторяющиеся голоса связывают песни в единое альбомное пространство."]},
"route-30":{label:"Региональные школы",issue:"030",labelName:"Rap-A-Lot Records / Noo Trybe Records",runtime:"около 43 минут",genre:"Southern hip-hop / gangsta rap",country:"Хьюстон, Техас",feature:"Дневник без эффектной развязки",description:"Scarface отказывается от постоянной бравады в пользу мрачных историй о насилии, смертности и личной ответственности; спокойная интонация делает материал особенно тяжёлым.",intro:"Это альбом для последовательного прослушивания. Следи за тем, как рассказчик переходит от наблюдения к исповеди, и обращай внимание на паузы и тембр Scarface: эмоциональная сила часто возникает не из громкости, а из сдержанности.",context:"The Diary вышел в 1994 году и стал третьим сольным студийным альбомом Scarface. Его истории о смерти, насилии и последствиях решений звучат сосредоточеннее и лаконичнее, чем на некоторых более масштабных работах артиста. «I Seen a Man Die» и «Hand of the Dead Body» показывают разные стороны пластинки: личную трагедию и полемику вокруг образа gangsta rap.",facts:["Альбом выпущен 18 октября 1994 года на Rap-A-Lot Records и Noo Trybe Records.","Это третий сольный студийный альбом Scarface.","В стандартном 13-трековом варианте есть «I Seen a Man Die» и «Hand of the Dead Body» при участии Ice Cube и Devin the Dude."]},
"route-31":{label:"Региональные школы",issue:"031",labelName:"LaFace Records / Arista Records",runtime:"около 61 минуты",genre:"Southern hip-hop",country:"Атланта, Джорджия",feature:"Южный хип-хоп говорит от лица сообщества",description:"Goodie Mob соединяют многоголосую подачу, социальные наблюдения и тёплую, насыщенную продакшеном Organized Noize музыку, в которой район и память становятся частью повествования.",intro:"Внимательно слушай смену голосов: четыре участника создают разные углы зрения на общую жизнь. Заглавный трек, «Cell Therapy» и более короткие эпизоды показывают, как пластинка балансирует между общим заявлением и личными историями.",context:"Soul Food — дебютный альбом Goodie Mob, выпущенный в 1995 году. Продакшен Organized Noize связывает группу с музыкальным кругом Dungeon Family и ранней сценой Атланты. Пластинка делает локальный опыт центральной темой и часто звучит одновременно как коллективный портрет и разговор нескольких индивидуальностей; выражение «Dirty South» появляется здесь в названии отдельного трека.",facts:["Дебют Goodie Mob вышел в 1995 году на LaFace Records; распространением занималась Arista.","Основным продюсерским коллективом была Organized Noize.","В квартет входили Cee-Lo, Big Gipp, Khujo и T-Mo; альбом включает гостевые появления участников связанного круга Dungeon Family."]},
"route-32":{label:"Региональные школы",issue:"032",labelName:"Interscope Records / Out da Gutta Records",runtime:"около 66 минут",genre:"Conscious rap / West Coast hip-hop",country:"США",feature:"Уязвимость внутри образа непобедимости",description:"2Pac соединяет уличную прямоту с тревогой, памятью и исповедальной интонацией. Вместо единственного образа артиста альбом показывает напряжение между выживанием, близостью и страхом.",intro:"Слушай не только самые известные песни. Важно, как агрессивные номера сменяются мелодичными и уязвимыми композициями, а голос 2Pac остаётся центром даже при смене продакшена и эмоциональной температуры.",context:"Me Against the World вышел в марте 1995 года и стал третьим студийным альбомом 2Pac. Записанный в период личных и юридических потрясений, он часто обращается к уязвимости, бедности, семейной памяти и опасности. Пластинка звучит более внутренне и рефлексивно, чем образ бесконечной уверенности, с которым артиста часто связывают позднее.",facts:["Альбом вышел 14 марта 1995 года; среди лейблов релиза — Interscope и Out da Gutta.","Это третий студийный альбом 2Pac.","«Dear Mama» и «So Many Tears» демонстрируют исповедальную сторону пластинки, а не только её боевой образ."]},
"route-33":{label:"Региональные школы",issue:"033",labelName:"Prophet Entertainment",runtime:"около 74 минут",genre:"Memphis rap / horrorcore",country:"Мемфис, Теннесси",feature:"Мемфисский андеграунд выбирает тёмный звук",description:"Three 6 Mafia строят сырую, гнетущую звуковую среду из повторяющихся петель, низкой фактуры и коллективных голосов. Здесь атмосфера сама становится главным музыкальным инструментом.",intro:"Слушай альбом громче не обязательно — слушай внимательнее. Вместо полированного продакшена здесь работают повтор, мрачный тембр, резкие выкрики и ощущение тесного пространства. Отмечай, как эти приёмы влияют на более поздний южный рэп.",context:"Mystic Stylez вышел в 1995 году на независимом Prophet Entertainment и стал первым полноформатным альбомом Three 6 Mafia. DJ Paul и Juicy J помогли сформировать особый мемфисский стиль на пересечении хорроркора, гангста-рэпа и локального DIY-подхода. Неровная фактура и конфронтационная риторика — часть этой эстетики, но не повод романтизировать насилие или употребление веществ.",facts:["Альбом вышел 30 мая 1995 года на Prophet Entertainment.","Продакшен связан прежде всего с основателями группы DJ Paul и Juicy J.","Поздние переиздания могут менять порядок и состав: например, вариант More Mystic Stylez не полностью совпадает с исходным релизом."]},
"route-34":{label:"Региональные школы",issue:"034",labelName:"Jive Records",runtime:"около 65 минут",genre:"Southern hip-hop / Texas rap",country:"Порт-Артур, Техас",feature:"Техасский грув движется медленно и тяжело",description:"UGK строят узнаваемый звук на басе, фанковых деталях и контрасте двух голосов. Медленный темп здесь не означает статичность: грув тянет композиции вперёд почти физически.",intro:"Главный ориентир — низкочастотная линия и работа Pimp C с аранжировкой. Сравни его более мелодичную сторону с прямолинейной подачей Bun B; также обрати внимание, как альбом держит единый ночной темп.",context:"Ridin' Dirty — третий студийный альбом техасского дуэта UGK, выпущенный в 1996 году на Jive Records. Pimp C и Bun B сочетали южный фанк, уличное повествование и собственный региональный характер, не сводя музыку к копии западного или восточного побережья. Продакшен намеренно оставляет пространство для баса и неторопливой подачи.",facts:["Альбом вышел 30 июля 1996 года на Jive Records.","Это третий студийный альбом UGK, дуэта Pimp C и Bun B.","Пластинка стала одной из наиболее узнаваемых работ техасской сцены 1990-х, хотя широкое признание пришло не сразу."]},
"route-35":{label:"Региональные школы",issue:"035",labelName:"LaFace Records",runtime:"около 49 минут",genre:"Southern hip-hop / alternative rap",country:"Атланта, Джорджия",feature:"Outkast превращают Атланту в космос",description:"На втором альбоме Outkast сохраняют южный грув, но делают звук более атмосферным и футуристичным. Космические образы подчёркивают ощущение чужака, который смотрит на собственный город со стороны.",intro:"Сравни ATLiens с дебютом: здесь больше пространства, тёмных синтезаторов и задумчивой интонации. «Elevators» остаётся доступной точкой входа, но именно менее очевидные переходы создают ощущение чужой планеты.",context:"ATLiens вышел в 1996 году и стал вторым альбомом Outkast после Southernplayalisticadillacmuzik. Название соединяет ATL — сокращение от Atlanta — со словом aliens, превращая локальную идентичность в образ инопланетян среди своих. Пластинка сохраняет связь с фанком и южным рэпом, но развивает более воздушную, задумчивую эстетику, которая подготовит дальнейшие эксперименты дуэта.",facts:["Альбом выпущен 27 августа 1996 года на LaFace Records.","Это второй студийный альбом Outkast.","Название ATLiens соединяет сокращение ATL с образом alien; тема инаковости проходит и через визуальное оформление, и через музыку."]}

const editorialCatalogC = {
"route-36":{issue:"036",label:"Региональные школы",labelName:"Death Row Records / Interscope Records",runtime:"около 132 минут",genre:"West Coast hip-hop / gangsta rap",country:"США",feature:"Двойной альбом как панорама эпохи",description:"All Eyez on Me разрастается в большой, противоречивый автопортрет 2Pac: празднование успеха соседствует с подозрительностью, уязвимостью и постоянным ощущением угрозы.",intro:"Это двойной альбом — не пытайся слушать его как короткую подборку хитов. Сравни более расслабленные песни, гостевые композиции и треки, где голос 2Pac звучит почти как внутренний монолог. Важна не только энергия, но и резкие перепады настроения.",context:"Вышедший в 1996 году All Eyez on Me стал первым двойным студийным альбомом 2Pac и одной из ключевых работ Death Row Records. Продакшен охватывает несколько оттенков западного побережья, а большое число гостей превращает пластинку в панораму окружения артиста. Её масштаб и праздничная энергия соседствуют с тревожным чувством наблюдения и предательства.",facts:["Выпущен в феврале 1996 года на Death Row Records и Interscope Records.","Это двойной альбом, один из центральных релизов позднего периода карьеры 2Pac.","На разных изданиях могут отличаться бонусные материалы и состав треков; для маршрута важна конкретная стандартная версия."]},
"route-37":{issue:"037",label:"Региональные школы",labelName:"LaFace Records / Arista Records",runtime:"около 74 минут",genre:"Southern hip-hop / alternative rap",country:"Атланта, Джорджия",feature:"Outkast расширяют границы южного звука",description:"Aquemini соединяет земной южный грув с психоделией, живыми инструментами и длинными повествованиями — альбом звучит как встреча двух индивидуальностей, которые не хотят выбирать одну форму.",intro:"Слушай, как Big Boi и André 3000 по-разному двигаются внутри одного трека. Альбом часто меняет темп и фактуру: от жёсткого рэпа к живому фанку, психоделии и почти кинематографическим историям.",context:"Третий альбом Outkast вышел в 1998 году и продолжил развитие Атланты как самостоятельного музыкального центра. Название соединяет знаки зодиака участников — Aquarius и Gemini — и отражает идею двух разных характеров внутри одного дуэта. Пластинка расширяет палитру группы, сохраняя связь с южной традицией и открываясь живым инструментам и экспериментам.",facts:["Выпущен в 1998 году на LaFace Records.","Это третий студийный альбом Outkast после Southernplayalisticadillacmuzik и ATLiens.","Название Aquemini отсылает к астрологическим знакам Big Boi и André 3000."]},
"route-38":{issue:"038",label:"Региональные школы",labelName:"LaFace Records / Arista Records",runtime:"около 74 минут",genre:"Southern hip-hop / funk / experimental rap",country:"Атланта, Джорджия",feature:"Фанк, футуризм и поп-энергия",description:"Stankonia превращает Outkast в музыкальную лабораторию: грязный фанк, синтезаторы, резкие переключения и огромные припевы сосуществуют без попытки сгладить углы.",intro:"Пластинка специально не держится на одном звуке. Сравни стремительный «B.O.B.», более мягкие песни и короткие интерлюдии: эксперимент здесь не противоположен поп-мелодии, а помогает ей выделиться.",context:"Stankonia вышел в 2000 году и стал четвёртым студийным альбомом Outkast. Группа продолжила отход от строгих жанровых границ: электронные тембры, фанк, южный рэп и необычная структура песен образуют единый, но непредсказуемый мир. Альбом закрепил способность дуэта одновременно экспериментировать и создавать широкие хиты.",facts:["Вышел в октябре 2000 года на LaFace Records.","Четвёртый студийный альбом Outkast.","«B.O.B. (Bombs Over Baghdad)» стал одним из наиболее узнаваемых примеров энергичного, жанрово смешанного звучания группы."]},
"route-39":{issue:"039",label:"Альтернативный звук и андеграунд",labelName:"Rawkus Records",runtime:"около 67 минут",genre:"Underground hip-hop / abstract hip-hop",country:"Нью-Йорк, США",feature:"Андеграунд как звуковая архитектура",description:"Company Flow отказываются от гладкого радио-рэпа в пользу абстрактных образов, шероховатых битов и плотной словесной конструкции. Музыка ощущается как самостоятельная среда, которую нужно исследовать.",intro:"Не жди очевидных припевов и лёгкого входа. Слушай, как El-P собирает угловатые биты, а MC меняют масштаб образов и ритм речи. Здесь важнее фактура, монтаж и повторное прослушивание, чем мгновенная доступность.",context:"Funcrusher Plus стал полноформатным заявлением Company Flow и важным релизом независимой нью-йоркской сцены конца 1990-х. Альбом связан с ранним Rawkus и эстетикой, которая ставила творческую автономию и звуковой эксперимент выше формата коммерческого радио. Позже El-P продолжил развивать этот подход как продюсер и участник других проектов.",facts:["Альбом вышел в 1997 году после ранних EP группы.","Company Flow в этот период связывали с независимым лейблом Rawkus Records.","Продакшен El-P делает шум, диссонанс и сложный монтаж частью музыкальной композиции."]},
"route-40":{issue:"040",label:"Альтернативный звук и андеграунд",labelName:"Rawkus Records / Priority Records",runtime:"около 50 минут",genre:"Conscious hip-hop / East Coast rap",country:"Бруклин, Нью-Йорк",feature:"Два голоса, общий разговор",description:"Black Star соединяют технику MC, философские вопросы и повседневный опыт Бруклина. Альбом звучит как разговор двух артистов, которые спорят, дополняют друг друга и не растворяются в общей позиции.",intro:"Сравнивай куплеты Mos Def и Talib Kweli: они делят близкую систему ценностей, но отличаются ритмом речи и способом строить мысль. Обрати внимание, как гостевые голоса и мелодические фрагменты расширяют разговор.",context:"Дебютный альбом Black Star вышел в 1998 году и объединил Mos Def и Talib Kweli на волне независимой сцены Rawkus. Название отсылает к Black Star Line Маркуса Гарви, а тексты затрагивают идентичность, историю, политику и жизнь в Нью-Йорке. Продакшен нескольких битмейкеров придаёт альбому разнообразие, не разрушая ощущение общего проекта.",facts:["Вышел 29 сентября 1998 года; в релизе участвовали Rawkus, Priority и связанные дистрибьюторы.","Дуэт составили Mos Def (позднее Yasiin Bey) и Talib Kweli.","Название отсылает к Black Star Line, основанной Маркусом Гарви."]},
"route-41":{issue:"041",label:"Альтернативный звук и андеграунд",labelName:"Rawkus Records / Priority Records",runtime:"около 71 минуты",genre:"East Coast hip-hop / jazz rap",country:"Бруклин, Нью-Йорк",feature:"Сольный голос шире жанровых рамок",description:"Black on Both Sides соединяет рэп, живые инструменты, соул и политическую рефлексию. Mos Def меняет тембр и ритм от песни к песне, поэтому альбом звучит как открытый поиск, а не фиксированный стиль.",intro:"Обращай внимание на живые барабаны, бас, гитару и вокальные фрагменты: музыка часто дышит как ансамбль, а не как петля вокруг одного MC. Вслушайся в переходы между личными песнями и социальными наблюдениями.",context:"Сольный дебют Mos Def вышел в 1999 году после успеха Black Star. Альбом сочетает социально ориентированные тексты с более широким музыкальным диапазоном, включая живую инструментовку и влияния соула и джаза. Он демонстрирует артиста, который не хочет сводить себя к одной манере рэпа.",facts:["Вышел 12 октября 1999 года на Rawkus Records и Priority Records.","Это дебютный сольный студийный альбом Mos Def.","На пластинке сочетаются рэп, живая инструментовка и социально ориентированные тексты."]},
"route-42":{issue:"042",label:"Альтернативный звук и андеграунд",labelName:"MCA Records",runtime:"около 70 минут",genre:"Alternative hip-hop / jazz rap",country:"Филадельфия, Пенсильвания",feature:"Живая группа внутри хип-хопа",description:"The Roots строят песни как ансамбль: ударные, бас, клавиши, гости и скретчи развиваются вокруг рэпа, а не просто повторяют петлю. Альбом балансирует музыкальную сложность и прямое повествование.",intro:"Слушай ритм-секцию отдельно от текста. Questlove и группа создают движение через живую динамику, а гостевые MC меняют плотность звучания. Обрати внимание на то, как интерлюдии и переходы удерживают альбомную форму.",context:"Things Fall Apart вышел в 1999 году и стал четвёртым студийным альбомом The Roots. Записи конца 1990-х связаны с более широким кругом Soulquarians, где пересекались хип-хоп, нео-соул и живая инструментовка. Пластинка помогла закрепить The Roots как группу, которая могла соединять альбомную концепцию, ансамблевую игру и социальный комментарий.",facts:["Вышел 23 февраля 1999 года на MCA Records.","Четвёртый студийный альбом The Roots.","На альбоме есть «You Got Me» с участием Erykah Badu и Eve; издания отличаются отдельными бонусами и скрытыми треками."]},
"route-43":{issue:"043",label:"Альтернативный звук и андеграунд",labelName:"Fondle 'Em Records",runtime:"около 58 минут",genre:"Underground hip-hop / lo-fi hip-hop",country:"США",feature:"Супергеройский миф из обрезков поп-культуры",description:"Operation: Doomsday представляет MF DOOM через мультяшные фрагменты, грубоватые биты и плотные рифмы. Маска злодея — не просто образ, а способ превратить личную историю в миф.",intro:"Слушай переходы между полноценными треками и короткими скитами: они собирают мир доктора Дума как радиоколлаж. В самих куплетах отслеживай внутренние рифмы, неожиданные ударения и то, как DOOM прячет смысл за юмором.",context:"Operation: Doomsday стал первым сольным альбомом Daniel Dumile под именем MF DOOM и впервые вышел на независимом Fondle 'Em в 1999 году. После потери брата Subroc и распада KMD Dumile вернулся в хип-хоп с новым персонажем, вдохновлённым комиксным злодеем Doctor Doom. Издания альбома заметно отличаются составом и оформлением, поэтому точный трек-лист нужно привязывать к конкретной версии.",facts:["Первоначальный релиз вышел в 1999 году на Fondle 'Em Records; переиздания 2001 и 2008 годов отличаются трек-листом.","Это дебютный сольный альбом MF DOOM под этим именем.","Мультяшные скиты и звуковые коллажи — существенная часть концепции пластинки."]},
"route-44":{issue:"044",label:"Альтернативный звук и андеграунд",labelName:"GoodVibe Recordings",runtime:"около 75 минут",genre:"Hip-hop / neo-soul",country:"Детройт, Мичиган",feature:"J Dilla превращает петлю в живое дыхание",description:"Fantastic, Vol. 2 объединяет точные, чуть смещённые биты Jay Dee с разными голосами Slum Village. Грув кажется расслабленным, но его микродвижения требуют внимательного слушания.",intro:"Вслушивайся в ударные и бас: они могут слегка опережать или отставать от ожидаемого ощущения времени. Сравни куплеты T3, Baatin и Jay Dee, а также гостевые появления, которые расширяют палитру, не ломая фирменный грув.",context:"Fantastic, Vol. 2 вышел в 2000 году, хотя был в основном записан несколькими годами ранее. В классическом составе Slum Village были T3, Baatin и Jay Dee (J Dilla). Задержка релиза и изменения в музыкальной индустрии сделали пластинку своеобразным мостом между детройтским андеграундом, хип-хопом и будущей волной нео-соула.",facts:["Альбом вышел в 2000 году на GoodVibe Recordings; ранние записи были сделаны в конце 1990-х.","Классический состав группы на этой пластинке — T3, Baatin и Jay Dee.","Переиздание Fantastic Vol. 2.10 добавило бонусные треки, инструменталы и изменило часть последовательности."]},

/* Fill incomplete route entries from a matched MusicBrainz release when online.
   Never replace a populated tracklist; require both release title and artist to match. */
async function hydrateMissingRouteTracks(){
  let staticTracksAdded=false;
  if(window.NO_SIGNAL_TRACKLISTS){
    for(const [id,titles] of Object.entries(window.NO_SIGNAL_TRACKLISTS)){
      const a=albums[id];
      if(a&&(!a.tracks||!a.tracks.length)&&Array.isArray(titles)&&titles.length){
        const notes=(window.NO_SIGNAL_TRACK_NOTES&&window.NO_SIGNAL_TRACK_NOTES[id])||(window.NO_SIGNAL_TRACK_NOTES_EXTRA&&window.NO_SIGNAL_TRACK_NOTES_EXTRA[id])||(window.NO_SIGNAL_TRACK_NOTES_EXTRA_B&&window.NO_SIGNAL_TRACK_NOTES_EXTRA_B[id])||[];
        a.tracks=titles.map((title,index)=>[title,'',notes[index]||'Редакционная заметка к этому треку ещё готовится.']);
        a.editionNote='Названия загружены из подготовленного списка; порядок и состав издания требуют финальной сверки.';
        staticTracksAdded=true;
      }
    }
  }
  if(staticTracksAdded)render();
  const normMusic=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
  const scoreMusic=(wanted,actual)=>{
    const w=normMusic(wanted),a=normMusic(actual);
    if(!w||!a)return 0;
    if(w===a)return 1;
    const wt=new Set(w.split(' ')),at=new Set(a.split(' '));
    let n=0;for(const t of wt)if(at.has(t))n++;
    return n/Math.max(1,wt.size);
  };
  for(const r of learningRoute){
    const a=albums[r.id];
    if(!a||a.tracks?.length)continue;
    try{
      const q='release:"'+a.title.replace(/["\\]/g,'')+'" AND artist:"'+a.artist.replace(/["\\]/g,'')+'"';
      const search=await fetch('https://musicbrainz.org/ws/2/release/?query='+encodeURIComponent(q)+'&fmt=json&limit=10',{headers:{'Accept':'application/json'}});
      if(!search.ok)continue;
      const results=(await search.json()).releases||[];
      const candidates=results.map(x=>({...x,ts:scoreMusic(a.title,x.title),as:scoreMusic(a.artist,(x['artist-credit']||[]).map(y=>typeof y==='string'?y:(y.name||y.artist?.name||'')).join(' '))}))
        .filter(x=>x.ts>=.8&&x.as>=.65)
        .sort((x,y)=>(y.ts+y.as)-(x.ts+x.as));
      if(!candidates.length)continue;
      const best=candidates[0];
      if(candidates[1]&&Math.abs((best.ts+best.as)-(candidates[1].ts+candidates[1].as))<.05&&best.id!==candidates[1].id)continue;
      const detail=await fetch('https://musicbrainz.org/ws/2/release/'+best.id+'?inc=recordings&fmt=json',{headers:{'Accept':'application/json'}});
      if(!detail.ok)continue;
      const release=await detail.json();
      const trackRows=(release.media||[]).flatMap(m=>(m.tracks||[]).map(t=>t.title||t.recording?.title).filter(Boolean));
      if(!trackRows.length)continue;
      a.tracks=trackRows.map((title,index)=>[title,'',((window.NO_SIGNAL_TRACK_NOTES&&window.NO_SIGNAL_TRACK_NOTES[r.id])||(window.NO_SIGNAL_TRACK_NOTES_EXTRA&&window.NO_SIGNAL_TRACK_NOTES_EXTRA[r.id])||(window.NO_SIGNAL_TRACK_NOTES_EXTRA_B&&window.NO_SIGNAL_TRACK_NOTES_EXTRA_B[r.id])||[])[index]||'Редакторская заметка к этому треку ещё не подготовлена.']);
      a.runtime='трек-лист загружен из MusicBrainz';
      a.trackSource='https://musicbrainz.org/release/'+best.id;
      a.editionNote='Автоматически сопоставленный релиз MusicBrainz; проверьте, что это нужное издание.';
      if(state.page==='article'&&state.album===r.id)render();
    }catch(e){}
  }
}

function attach(){document.querySelectorAll('[data-card-open]').forEach(card=>{card.addEventListener('click',e=>{if(e.target.closest('button,a'))return;go('article',card.dataset.cardOpen)});card.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('button,a')){e.preventDefault();go('article',card.dataset.cardOpen)}})});document.querySelectorAll('#main [data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go('article',b.dataset.open));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const id=b.dataset.save,s=getStore();s.saved=s.saved.includes(id)?s.saved.filter(x=>x!==id):[...s.saved,id];putStore(s);render();toast(s.saved.includes(id)?'Добавлено в «Моё»':'Убрано из сохранённого')});document.querySelectorAll('[data-reaction]').forEach(b=>b.onclick=()=>{const s=getStore(),id=b.dataset.reaction,value=b.dataset.value;if(s.reactions[id]===value)delete s.reactions[id];else s.reactions[id]=value;if(value==='later'&&s.reactions[id]==='later'&&!s.saved.includes(id))s.saved.push(id);putStore(s);render();toast(({hooked:'Отмечено: зацепило',miss:'Отмечено: мимо',later:'Отложено на потом'})[s.reactions[id]]||'Отметка удалена')});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{state.stage=b.dataset.stage;render()});document.querySelectorAll('[data-reset-filters]').forEach(b=>b.onclick=()=>{state.query='';state.filter='all';state.stage='all';state.sort='route';render()});const sortControl=document.getElementById('archive-sort');if(sortControl)sortControl.onchange=()=>{state.sort=sortControl.value;render()};const authForm=document.getElementById('cloud-auth-form');if(authForm)authForm.onsubmit=handleCloudAuth;const publishForm=document.getElementById('daily-publish-form');if(publishForm){publishForm.onsubmit=publishDailyIssue;const dateInput=document.getElementById('daily-date');if(dateInput&&!dateInput.value)dateInput.value=localDateKey()}const syncButton=document.querySelector('[data-cloud-sync]');if(syncButton)syncButton.onclick=syncCloudLibrary;const signoutButton=document.querySelector('[data-cloud-signout]');if(signoutButton)signoutButton.onclick=signOutCloud;refreshCloudUI();const exportButton=document.querySelector('[data-export-data]');if(exportButton)exportButton.onclick=exportPersonalData;const importButton=document.querySelector('[data-import-trigger]');if(importButton)importButton.onclick=()=>document.getElementById('import-data-file')?.click();const importInput=document.getElementById('import-data-file');if(importInput)importInput.onchange=()=>importPersonalData(importInput.files&&importInput.files[0]);document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.track);state.openTrack=state.openTrack===n?null:n;const id=state.album;render();if(id)document.querySelector(`[data-track="${n}"]`)?.scrollIntoView({block:'nearest',behavior:'smooth'})});document.querySelectorAll('[data-track-done]').forEach(input=>input.onchange=()=>{const s=getStore(),id=state.album,index=Number(input.dataset.trackDone);if(!id||!albums[id])return;if(!Array.isArray(s.trackProgress[id]))s.trackProgress[id]=[];s.trackProgress[id][index]=input.checked;putStore(s);const row=input.closest('.track');if(row)row.classList.toggle('done',input.checked);const checks=[...document.querySelectorAll('[data-track-done]')],count=checks.filter(x=>x.checked).length,fill=document.querySelector('[data-progress-fill]'),label=document.querySelector('[data-progress-count]'),bar=document.querySelector('[role="progressbar"][aria-label="Прогресс прослушивания"]');if(fill)fill.style.width=(checks.length?Math.round(count/checks.length*100):0)+'%';if(label)label.textContent=count+' / '+checks.length;if(bar)bar.setAttribute('aria-valuenow',String(count))});document.querySelectorAll('[data-save-track-note]').forEach(button=>button.onclick=()=>{const index=Number(button.dataset.saveTrackNote),field=document.querySelector('[data-track-note="'+index+'"]');if(!field)return;saveTrackNote(index,field.value);toast('Заметка сохранена')});document.querySelectorAll('[data-track-note]').forEach(field=>field.addEventListener('change',()=>saveTrackNote(Number(field.dataset.trackNote),field.value)));document.querySelectorAll('[data-album-complete]').forEach(button=>button.onclick=()=>{const id=button.dataset.albumComplete,s=getStore(),complete=s.completedAlbums.includes(id);if(complete)s.completedAlbums=s.completedAlbums.filter(x=>x!==id);else{s.completedAlbums=[...s.completedAlbums,id];s.trackProgress[id]=Array.from({length:albums[id].tracks.length},()=>true)}putStore(s);const y=window.scrollY;render();window.scrollTo(0,y);toast(complete?'Отметка о завершении снята':'Альбом отмечен как прослушанный')});const search=document.getElementById('archive-search');if(search){search.addEventListener('input',e=>{const pos=e.target.selectionStart;state.query=e.target.value;const y=window.scrollY;render();const next=document.getElementById('archive-search');next.focus();next.setSelectionRange(pos,pos);window.scrollTo(0,y)})}}
